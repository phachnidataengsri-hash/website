<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PET PARTY 🐾</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #fff0f5, #eee3ff);
    color: #49336d;
}

header {
    text-align: center;
    padding: 55px 20px 35px;
    background: linear-gradient(135deg, #ed91bd, #a985e8);
    color: white;
}

header h1 {
    font-size: 42px;
    margin: 0 0 12px;
}

header p {
    font-size: 17px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px;
}

.filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 30px;
}

.filter-btn {
    border: 2px solid #d58cbd;
    background: white;
    color: #a34d91;
    padding: 10px 22px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: all 0.3s ease;
}

.filter-btn:hover,
.filter-btn.active {
    background: #d46cae;
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 4px 12px rgba(212, 108, 174, 0.4);
}

.gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 15px #d8b9d9;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 25px #c49acb;
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.card-info {
    padding: 17px;
}

.card-info h3 {
    margin: 0 0 8px;
    font-size: 18px;
}

.card-info p {
    color: #7b59a6;
    margin: 0;
    font-size: 14px;
    line-height: 1.4;
}

.category {
    display: inline-block;
    background: #fce4f3;
    color: #a34d91;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 10px;
}

.card.hide {
    display: none;
}

.about {
    background: white;
    margin-top: 40px;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
}

footer {
    text-align: center;
    padding: 25px;
    color: #a34d91;
    font-weight: bold;
}

@media (max-width: 992px) {
    .gallery {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 750px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 480px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🐾 PET PARTY 🐶</h1>
    <p>โลกแห่งสัตว์เลี้ยง ค้นหาเพื่อนตัวโปรดที่ใช่สำหรับคุณ 💗</p>
</header>

<div class="container">

    <div class="filters">
        <button class="filter-btn active" onclick="filterPet('all', this)">ทั้งหมด</button>
        <button class="filter-btn" onclick="filterPet('dog', this)">🐶 สุนัข</button>
        <button class="filter-btn" onclick="filterPet('cat', this)">🐱 แมว</button>
        <button class="filter-btn" onclick="filterPet('small', this)">🐹 สัตว์ตัวเล็ก</button>
        <button class="filter-btn" onclick="filterPet('bird', this)">🐦 นก</button
